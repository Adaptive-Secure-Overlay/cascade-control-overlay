name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build CLI (${{ matrix.asset_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: cco-linux-x86_64-musl
            archive: tar.gz
            bin: cco
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_name: cco-linux-aarch64-musl
            archive: tar.gz
            bin: cco
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: cco-windows-x86_64
            archive: zip
            bin: cco.exe
            musl: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: cco-macos-aarch64
            archive: tar.gz
            bin: cco
            musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p cco-cli

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/stage
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          strip "$BIN" || true
          cp "$BIN" "dist/stage/${{ matrix.bin }}"
          cp README.md README.ru.md LICENSE-MIT LICENSE-APACHE dist/stage/
          tar -C dist/stage -czf "dist/${{ matrix.asset_name }}.tar.gz" .
          ls -lh "dist/${{ matrix.asset_name }}.tar.gz"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/stage/${{ matrix.bin }}"
          Copy-Item README.md, README.ru.md, LICENSE-MIT, LICENSE-APACHE dist/stage/
          Compress-Archive -Path "dist/stage/*" -DestinationPath "dist/${{ matrix.asset_name }}.zip" -Force
          Get-Item "dist/${{ matrix.asset_name }}.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.${{ matrix.archive }}

  build-android-gui:
    name: Build Android APK (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android-jni
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Cross-compile libcco_ffi.so
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          chmod +x apps/android/scripts/build_jni_libs.sh
          bash apps/android/scripts/build_jni_libs.sh
      - name: Test and package Android universal APK
        run: |
          (cd apps/android && gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace)
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/cco-android-universal.apk
          ls -lh dist/cco-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cco-android-universal
          path: dist/cco-android-universal.apk

  build-windows-gui:
    name: Build Windows WPF GUI (cco_ffi.dll + Wintun)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-gui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build cco_ffi.dll, verify Wintun 0.14.1, test, and package WPF ZIP
        shell: pwsh
        run: |
          cargo build --release --locked -p cco-ffi
          New-Item -ItemType Directory -Force apps/windows/native | Out-Null
          Copy-Item target/release/cco_ffi.dll apps/windows/native/cco_ffi.dll -Force
          ./apps/windows/scripts/fetch-wintun.ps1
          dotnet test apps/windows/Cco.Windows.sln -c Release
          dotnet publish apps/windows/src/Cco.Windows.App/Cco.Windows.App.csproj -c Release -r win-x64 --self-contained false -o dist/windows-gui
          Copy-Item README.md, README.ru.md, LICENSE-MIT, LICENSE-APACHE dist/windows-gui/
          Compress-Archive -Path "dist/windows-gui/*" -DestinationPath "dist/cco-windows-gui-x86_64.zip" -Force
          Get-Item "dist/cco-windows-gui-x86_64.zip" | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: cco-windows-gui-x86_64
          path: dist/cco-windows-gui-x86_64.zip

  build-macos-gui:
    name: Build macOS SwiftUI GUI (libcco_ffi.a)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-gui
      - name: Build libcco_ffi.a, test XCTest, and package CcoMacApp.app
        run: |
          chmod +x apps/macos/scripts/build_macos.sh
          bash apps/macos/scripts/build_macos.sh
          mkdir -p dist
          cp README.md README.ru.md LICENSE-MIT LICENSE-APACHE apps/macos/dist/
          tar -C apps/macos/dist -czf dist/cco-macos-gui-aarch64.tar.gz CcoMacApp.app README.md README.ru.md LICENSE-MIT LICENSE-APACHE
          ls -lh dist/cco-macos-gui-aarch64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cco-macos-gui-aarch64
          path: dist/cco-macos-gui-aarch64.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [build, build-android-gui, build-windows-gui, build-macos-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
