name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-clippy:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python cryptography for Rust<->Python wire cross-compat E2E
        run: python -m pip install --quiet cryptography
      - run: cargo test --workspace

  musl-build:
    name: Static Linux musl Binary (L4 Drop-In)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build static x86_64-unknown-linux-musl binary
        run: |
          cargo build --release --target x86_64-unknown-linux-musl -p cco-cli
          strip target/x86_64-unknown-linux-musl/release/cco
          ls -lh target/x86_64-unknown-linux-musl/release/cco
      - uses: actions/upload-artifact@v4
        with:
          name: cco-linux-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/cco

  bench-smoke:
    name: Benchmark & WireGuard Matrix Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run release CLI smokes
        run: |
          cargo build --release -p cco-cli
          ./target/release/cco bench crypto --iters 50
          ./target/release/cco bench monte-carlo --trials 200000 --n 10 --m 2 --j 3
          ./target/release/cco wg-sim --format eve-json >/dev/null

  netns-l3-live:
    name: Live Linux netns + strongSwan + nftables (L3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install strongSwan, nftables, and tcpdump
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            strongswan strongswan-swanctl strongswan-charon \
            libstrongswan-standard-plugins \
            nftables iproute2 tcpdump iputils-ping openssl
          # Ubuntu 24.04 enforces AppArmor profiles for charon/swanctl that deny
          # reading ephemeral lab configs from /tmp; unload them on the CI runner.
          for profile in /etc/apparmor.d/usr.lib.ipsec.charon /etc/apparmor.d/usr.sbin.swanctl; do
            if [ -f "$profile" ]; then
              sudo apparmor_parser -R "$profile" 2>/dev/null || true
            fi
          done
      - name: Build release cco binary
        run: cargo build --release -p cco-cli
      - name: Run live 4-node strongSwan overlay verification
        run: |
          chmod +x lab/scripts/*.sh
          sudo CCO_BIN="$PWD/target/release/cco" bash lab/scripts/netns_e2e.sh

  wg-userspace-l3-live:
    name: Live Linux netns + Userspace WireGuard (L3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install iproute2, tcpdump, and iputils-ping
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 tcpdump iputils-ping
      - name: Build release cco binary
        run: cargo build --release -p cco-cli
      - name: Run live 4-node userspace WireGuard split-plane verification
        run: |
          chmod +x lab/scripts/*.sh
          sudo CCO_BIN="$PWD/target/release/cco" bash lab/scripts/wg_userspace_e2e.sh

  android-build:
    name: Android APK & JNI Build (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Cross-compile libcco_ffi.so for Android ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          chmod +x apps/android/scripts/build_jni_libs.sh
          bash apps/android/scripts/build_jni_libs.sh
      - name: Run Android unit tests and assemble debug APK
        working-directory: apps/android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cco-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  windows-gui-build:
    name: Windows WPF Client + cco_ffi.dll + Wintun
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Build release cco_ffi.dll and verify official Wintun 0.14.1
        shell: pwsh
        run: |
          cargo build --release -p cco-ffi
          New-Item -ItemType Directory -Force apps/windows/native | Out-Null
          Copy-Item target/release/cco_ffi.dll apps/windows/native/cco_ffi.dll -Force
          ./apps/windows/scripts/fetch-wintun.ps1
      - name: Run .NET 9 P/Invoke integration tests and build WPF app
        shell: pwsh
        run: |
          dotnet test apps/windows/Cco.Windows.sln -c Release --verbosity normal
          dotnet publish apps/windows/src/Cco.Windows.App/Cco.Windows.App.csproj -c Release -r win-x64 --self-contained false -o apps/windows/publish
      - uses: actions/upload-artifact@v4
        with:
          name: cco-windows-gui-x86_64
          path: apps/windows/publish

  macos-gui-build:
    name: macOS SwiftUI Client + libcco_ffi.a + XCTest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build libcco_ffi.a, run XCTest, and package CcoMacApp.app
        run: |
          chmod +x apps/macos/scripts/build_macos.sh
          bash apps/macos/scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cco-macos-app-bundle
          path: apps/macos/dist/CcoMacApp.app

  security-audit:
    name: Cargo Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
