[workspace]
resolver = "2"
members = [
    "crates/cco-crypto",
    "crates/cco-trust",
    "crates/cco-proto",
    "crates/cco-cascade",
    "crates/cco-transport",
    "crates/cco-linux-proxy",
    "crates/cco-analytics",
    "crates/cco-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Vladislav Zyuzin <vlados9597@mail.ru>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZuyVladislav/cascade-control-overlay"
homepage = "https://github.com/ZuyVladislav/cascade-control-overlay"
keywords = ["vpn", "ikev2", "wireguard", "overlay", "cryptography"]
categories = ["network-programming", "cryptography"]

[workspace.dependencies]
cco-crypto = { path = "crates/cco-crypto" }
cco-trust = { path = "crates/cco-trust" }
cco-proto = { path = "crates/cco-proto" }
cco-cascade = { path = "crates/cco-cascade" }
cco-transport = { path = "crates/cco-transport" }
cco-linux-proxy = { path = "crates/cco-linux-proxy" }
cco-analytics = { path = "crates/cco-analytics" }

aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
hex = "0.4"
hkdf = "0.12"
libc = "0.2"
nix = { version = "0.29", features = ["socket", "net"] }
num-bigint = "0.4"
num-traits = "0.2"
rand = { version = "0.8", features = ["small_rng"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1.10"
rsa = { version = "0.9", features = ["sha2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.5"
subtle = "2.6"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
